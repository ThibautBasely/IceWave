name: Build Ice Wave VST3

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target IceWave_VST3

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: IceWave-VST3-Windows
          path: build/IceWave_artefacts/Release/VST3/
